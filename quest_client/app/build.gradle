plugins {
    id "com.android.application"
}

android {
    namespace "com.yuchen.robovr"
    compileSdk 35

    defaultConfig {
        applicationId "com.yuchen.robovr"
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName "0.1.0"

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++20 -Wall -Wextra -Wpedantic"
            }
        }
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }
}
